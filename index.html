<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection Hub Fuyu-kun...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #F2F0EB;
            color: #2D2A26;
        }
        .loader {
            border: 4px solid #D8D0C4;
            border-top: 4px solid #1E3A5F;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #C46210; font-weight: bold; }
        button {
            padding: 10px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover { background: #2a4d7a; }
    </style>
    <script>
        // ✅ CORRECTION : L'URL pointe maintenant vers le bon repository "hub"
        const REDIRECT_JSON_URL = "https://sudonosaka.github.io/hub/redirect.json";
        
        async function redirect() {
            try {
                console.log("Tentative de chargement du JSON depuis :", REDIRECT_JSON_URL);
                
                // Le timestamp force le navigateur à ignorer le cache
                const urlWithCacheBuster = REDIRECT_JSON_URL + "?t=" + Date.now();
                
                const response = await fetch(urlWithCacheBuster);
                
                if (!response.ok) {
                    throw new Error("Erreur HTTP : " + response.status + " " + response.statusText);
                }
                
                const data = await response.json();
                console.log("✅ JSON reçu avec succès :", data);
                
                if (data && data.url) {
                    console.log("🚀 Redirection vers :", data.url);
                    window.location.href = data.url;
                } else {
                    throw new Error("Le JSON ne contient pas de champ 'url'");
                }
            } catch (error) {
                console.error("❌ Échec de la redirection :", error);
                document.body.innerHTML = `
                    <h1 class="error">Erreur de connexion au Hub</h1>
                    <p>Impossible de récupérer l'adresse du serveur.</p>
                    <p><small>Détail technique : ${error.message}</small></p>
                    <button onclick="location.reload();">🔄 Réessayer</button>
                `;
            }
        }

        window.onload = redirect;
    </script>
</head>
<body>
    <h2>Redirection vers le Hub en cours...</h2>
    <div class="loader"></div>
    <p>Si rien ne se passe après 5 secondes, actualisez la page.</p>
</body>
</html>
