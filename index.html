<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>hub</h1>
            <p class="subtitle">Hub permettant d'accéder aux autres sites et ressources</p>
        </div>
        <button id="theme-toggle" aria-label="Changer de thème">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
        </button>
    </header>

    <main>
        <section class="carousel-container">
            <button class="carousel-btn prev" aria-label="Précédent">❮</button>

            <div class="carousel">
                <div class="carousel-track">
                    <a href="https://sudonosaka.github.io/Structure-de-la-matiere/" class="card" data-name="Structure de la Matière">
                        <img src="image1.gif" alt="Structure de la Matière">
                        <span class="card-label">Structure de la Matière (SDLM)</span>
                    </a>
                    <a href="https://sudonosaka.github.io/Biologie-Moleculaire-et-Cellulaire/" class="card" data-name="Biologie Moléculaire et Cellulaire">
                        <img src="image2.gif" alt="Biollogie Moléculaire et Cellulaire">
                        <span class="card-label">Biologie Moléculaire et Cellulaire (BMC)</span>
                    </a>
                    <a href="#" class="card" data-name="Projet 3">
                        <img src="image3.png" alt="Projet 3">
                        <span class="card-label">Projet 3</span>
                    </a>
                    <a href="#" class="card" data-name="Projet 4">
                        <img src="image4.png" alt="Projet 4">
                        <span class="card-label">Projet 4</span>
                    </a>
                    <a href="#" class="card" data-name="Projet 5">
                        <img src="image5.png" alt="Projet 5">
                        <span class="card-label">Projet 5</span>
                    </a>
                    <a href="#" class="card" data-name="Projet 6">
                        <img src="image6.png" alt="Projet 6">
                        <span class="card-label">Projet 6</span>
                    </a>
                </div>
            </div>

            <button class="carousel-btn next" aria-label="Suivant">❯</button>
        </section>
    </main>

    <footer>
        <p>Hub - Université Evry Paris-Saclay - Fuyu-kun</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
