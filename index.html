   <!DOCTYPE html>
   <html lang="fr">
   <head>
       <meta charset="UTF-8">
       <title>Redirection Hub Fuyu-kun...</title>
       <script>
           const GIST_ID = "10a4e0de6af01d91cc1b1f91e06b0f3a";
           const USERNAME = "SudoNosaka";
           
           fetch(`https://api.github.com/gists/${GIST_ID}`)
           .then(res => res.json())
           .then(data => {
               const content = Object.values(data.files)[0].content;
               const json = JSON.parse(content);
               if (json.url) {
                   window.location.href = json.url;
               } else {
                   document.body.innerHTML = "<h1>Hub hors ligne</h1>";
               }
           })
           .catch(() => {
               document.body.innerHTML = "<h1>Erreur de connexion</h1>";
           });
       </script>
   </head>
   <body style="font-family: sans-serif; text-align: center; padding: 50px;">
       <h2>Redirection en cours...</h2>
   </body>
   </html>
