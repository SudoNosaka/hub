   <!DOCTYPE html>
   <html lang="fr">
   <head>
       <meta charset="UTF-8">
       <title>Redirection Hub Fuyu-kun...</title>
       <script>
           const BIN_ID = "6ad49638ffd5d1605375794a";
           const API_KEY = "$2a$10$4Nfj.Sh6QjGlPv6u./GBdOeSjuIrs2vmbD7wXztp3/D8teuvJatIS";
           
           fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
               headers: { 'X-Master-Key': API_KEY }
           })
           .then(res => res.json())
           .then(data => {
               if (data.record && data.record.url) {
                   window.location.href = data.record.url;
               } else {
                   document.body.innerHTML = "<h1>Hub actuellement hors ligne. Réessaie plus tard.</h1>";
